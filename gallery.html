<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标注画廊</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    background: #0c0c10;
    color: #e9e9f1;
    font: 13px/1.5 "微软雅黑", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #121218;
    border-bottom: 1px solid #22222b;
    flex-wrap: wrap;
  }
  .brand { font-size: 14px; letter-spacing: 0.06em; color: #f2f2f7; }
  .brand b { color: #8b7cf6; font-weight: 600; }
  .stat { color: #6d6d7e; font-size: 12px; letter-spacing: 0.02em; }
  .stat i { font-style: normal; color: #8a8a9c; }
  .spacer { flex: 1; }

  .seg { display: flex; background: #1a1a22; border-radius: 7px; padding: 2px; }
  .seg button {
    background: none; border: 0; padding: 4px 9px; border-radius: 5px;
    color: #7c7c8e; font-size: 12px; transition: background .12s, color .12s;
  }
  .seg button:hover { color: #c8c8d6; }
  .seg button.on { background: #2c2c38; color: #f0f0f6; }
  .seg button.on[data-v="keep"] { background: #1e3a2c; color: #74d6a4; }
  .seg button.on[data-v="unsure"] { background: #3a3320; color: #e5c16a; }
  .seg button.on[data-v="drop"] { background: #3a2226; color: #e88a8a; }

  select, input[type=search] {
    background: #1a1a22; color: #c9c9d6; border: 1px solid #26262f;
    border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 12px; outline: none;
  }
  select:focus, input[type=search]:focus { border-color: #47475a; }
  input[type=search] { width: 150px; }
  input[type=search]::placeholder { color: #55556a; }

  .ghost {
    background: #1a1a22; border: 1px solid #26262f; border-radius: 7px;
    padding: 5px 11px; font-size: 12px; color: #a8a8bb; transition: all .12s;
  }
  .ghost:hover { background: #22222c; color: #e0e0ec; }
  .ghost.hot { border-color: #8b7cf6; color: #b3a8ff; }
  .ghost.on { background: #2a2340; border-color: #8b7cf6; color: #c4bcff; }

  /* ---------- 主体 ---------- */
  .wrap { display: grid; grid-template-columns: 1fr 370px; overflow: hidden; }
  .scroll { overflow-y: auto; overflow-x: hidden; padding: 14px 16px 60px; }
  .scroll::-webkit-scrollbar { width: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: #26262f; border-radius: 5px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap: 9px;
  }

  /* ---------- 卡片 ---------- */
  .card {
    position: relative;
    aspect-ratio: 1 / 1;
    background: #14141a;
    border: 1px solid #1e1e26;
    border-radius: 9px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .12s, transform .12s;
    display: flex; align-items: center; justify-content: center;
  }
  .card:hover { border-color: #3a3a4a; transform: translateY(-1px); }
  .card.sel { border-color: #8b7cf6; box-shadow: 0 0 0 1px #8b7cf6 inset; }
  .card img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 3px; }
  .card.broken::after {
    content: '图不见了'; color: #4a4a5c; font-size: 11px; position: absolute;
  }
  .card.broken img { display: none; }

  /* drop / unsure 用左侧色条 + 轻度压暗，不做灰度 —— 灰度会看不清图是什么 */
  .card.drop img { opacity: .45; }
  .card.unsure img { opacity: .8; }
  .card.drop::before,
  .card.unsure::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; z-index: 2;
  }
  .card.drop::before { background: #8a3a40; }
  .card.unsure::before { background: #8a6a2a; }

  .pcat {
    position: absolute; left: 5px; top: 5px;
    font-size: 9px; font-weight: 600; letter-spacing: .04em;
    padding: 1px 4px; border-radius: 3px;
    background: #1b1b24; color: #9a9aad;
    opacity: .55; transition: opacity .12s;
  }
  .card:hover .pcat, .card.sel .pcat { opacity: 1; }
  .pc-P1 { background: #3d2323; color: #e07a70; }
  .pc-P2 { background: #3d3220; color: #e0a74f; }
  .pc-P3 { background: #1f2f3d; color: #6aa8dd; }
  .pc-P4 { background: #2c2440; color: #a596f0; }
  .pc-P5 { background: #1e3229; color: #63bb92; }

  .vb {
    position: absolute; right: 5px; bottom: 5px;
    width: 15px; height: 15px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; line-height: 1;
    opacity: 0; transition: opacity .12s;
  }
  .card:hover .vb, .card.sel .vb { opacity: 1; }
  .vb-keep { background: #234a36; color: #7ce0ab; }
  .vb-unsure { background: #4a3f22; color: #eed27a; }
  .vb-drop { background: #4a2529; color: #ef9090; }
  .vb-none { background: #2a2a34; color: #6a6a7c; }

  /* 小红点 —— 只给自上次标已读之后新录入的图 */
  .dot {
    position: absolute; right: 5px; top: 5px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #f05a5a; box-shadow: 0 0 0 2px rgba(240,90,90,.16);
    display: none;
  }
  .card.new .dot { display: block; }
  .card.flash { animation: flash .9s ease-out; }
  @keyframes flash {
    0% { border-color: #8b7cf6; box-shadow: 0 0 0 2px #8b7cf6; }
    100% { border-color: #1e1e26; box-shadow: none; }
  }

  /* ---------- 详情 ---------- */
  aside {
    background: #101016;
    border-left: 1px solid #22222b;
    overflow-y: auto;
    padding: 16px;
  }
  aside::-webkit-scrollbar { width: 8px; }
  aside::-webkit-scrollbar-thumb { background: #26262f; border-radius: 4px; }

  .empty {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    color: #4e4e60; font-size: 12px; text-align: center;
  }
  .empty .big { font-size: 26px; opacity: .5; }

  .d-imgwrap {
    background: #0a0a0e; border-radius: 10px; border: 1px solid #1e1e26;
    display: flex; align-items: center; justify-content: center;
    min-height: 160px; max-height: 42vh; overflow: hidden; margin-bottom: 12px;
  }
  .d-imgwrap img { max-width: 100%; max-height: 42vh; object-fit: contain; display: block; }

  .d-meta {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    font-size: 11px; color: #5c5c70; margin-bottom: 10px;
  }
  .d-meta .vbadge {
    padding: 1px 6px; border-radius: 4px; font-size: 10px;
    letter-spacing: .04em;
  }
  .v-keep { background: #1e3a2c; color: #74d6a4; }
  .v-unsure { background: #3a3320; color: #e5c16a; }
  .v-drop { background: #3a2226; color: #e88a8a; }
  .v-none { background: #26262f; color: #7a7a8c; }

  .d-desc {
    font-size: 14px; line-height: 1.65; color: #f0f0f6;
    margin-bottom: 14px; min-height: 23px;
  }
  .d-desc.blank { color: #46465a; font-size: 12px; font-style: italic; }

  .sec { margin-bottom: 15px; }
  .sec-t {
    font-size: 10px; letter-spacing: .12em; color: #55556c;
    margin-bottom: 6px; text-transform: uppercase;
  }

  .pq { display: flex; gap: 5px; }
  .pq span {
    flex: 1; text-align: center; font-size: 11px; padding: 5px 0;
    border-radius: 5px; background: #17171f; color: #4c4c60;
    border: 1px solid #1e1e26;
  }
  .pq span.on.pq-P1 { background: #3d2323; color: #e07a70; border-color: #5a3232; }
  .pq span.on.pq-P2 { background: #3d3220; color: #e0a74f; border-color: #5a4a2c; }
  .pq span.on.pq-P3 { background: #1f2f3d; color: #6aa8dd; border-color: #2e445a; }
  .pq span.on.pq-P4 { background: #2c2440; color: #a596f0; border-color: #423660; }
  .pq span.on.pq-P5 { background: #1e3229; color: #63bb92; border-color: #2c4a3a; }

  .pbar { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  .pbar b { font-size: 10px; color: #63637a; font-weight: 500; width: 17px; }
  .pbar .track { flex: 1; height: 4px; background: #1c1c26; border-radius: 2px; overflow: hidden; }
  .pbar .track i { display: block; height: 100%; border-radius: 2px; background: #4a4a60; }
  .pbar.hi .track i { background: #8b7cf6; }
  .pbar em { font-size: 10px; color: #5a5a70; font-style: normal; width: 26px; text-align: right; }
  .pbar.hi em { color: #a99fff; }
  .pbar.hi b { color: #a99fff; }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font-size: 11px; padding: 2px 7px; border-radius: 4px;
    background: #1a1a22; color: #9c9cb0; border: 1px solid #23232d;
  }
  .chip.bad { background: #2e1c20; color: #d98a8a; border-color: #43272c; }
  .chip.kv { background: #17171f; color: #7d7d92; }

  .d-foot {
    margin-top: 16px; padding-top: 11px; border-top: 1px solid #1c1c24;
    font-size: 10px; color: #44445a; letter-spacing: .03em; word-break: break-all;
  }
  .d-nav { display: flex; gap: 6px; margin-top: 12px; }
  .d-nav button {
    flex: 1; background: #17171f; border: 1px solid #22222c;
    border-radius: 6px; padding: 6px 0; font-size: 11px; color: #7d7d92;
  }
  .d-nav button:hover { background: #1e1e28; color: #c0c0d0; }
  .d-nav button:disabled { opacity: .3; cursor: default; }
</style>
</head>
<body>

<header>
  <div class="brand">标注<b>画廊</b></div>
  <div class="stat" id="stat">载入中</div>
  <div class="spacer"></div>

  <div class="seg" id="segV">
    <button data-v="" class="on">全部</button>
    <button data-v="keep">keep</button>
    <button data-v="unsure">unsure</button>
    <button data-v="drop">drop</button>
  </div>

  <div class="seg" id="segC">
    <button data-c="" class="on">P·全部</button>
    <button data-c="P1">P1</button>
    <button data-c="P2">P2</button>
    <button data-c="P3">P3</button>
    <button data-c="P4">P4</button>
    <button data-c="P5">P5</button>
  </div>

  <select id="selPart"><option value="">全部分区</option></select>

  <select id="selSort">
    <option value="new">最新录入在前</option>
    <option value="part">分区顺序</option>
  </select>

  <input id="q" type="search" placeholder="搜描述 / 标签">

  <button id="btnOnlyNew" class="ghost">只看新</button>
  <button id="btnRead" class="ghost">标为已读</button>
</header>

<div class="wrap">
  <div class="scroll" id="scroll"><div class="grid" id="grid"></div></div>
  <aside id="aside">
    <div class="empty" id="empty">
      <div class="big">◱</div>
      <div>点一张图看详情</div>
      <div style="font-size:11px;opacity:.7">← → 可以前后翻</div>
    </div>
  </aside>
</div>

<script>
(function () {
  'use strict'

  var LS_READ = 'mf.gallery.readAt'
  var POLL_MS = 4000

  var S = {
    all: [],          // 服务端全部条目
    view: [],         // 当前筛选+排序后
    parts: [],
    v: '', c: '', part: '', sort: 'new', q: '', onlyNew: false,
    readAt: 0,
    sel: null,
    elCache: new Map()  // id -> 卡片元素
  }

  var $ = function (id) { return document.getElementById(id) }
  var grid = $('grid')
  var scrollEl = $('scroll')
  var aside = $('aside')

  // ---------- 已读时间 ----------

  function loadReadAt() {
    var raw = localStorage.getItem(LS_READ)
    if (raw) {
      var n = parseInt(raw, 10)
      if (n > 0) return n
    }
    // 首次打开：最近 15 分钟算新，能立刻看到刚落地的成果
    return Date.now() - 15 * 60 * 1000
  }

  function finOf(it) {
    if (!it.fin) return 0
    var t = Date.parse(it.fin)
    return isNaN(t) ? 0 : t
  }

  function isNew(it) { return finOf(it) > S.readAt }

  // ---------- 排序 ----------

  function sortList(arr) {
    var a = arr.slice()
    if (S.sort === 'part') {
      a.sort(function (x, y) { return x.id < y.id ? -1 : x.id > y.id ? 1 : 0 })
    } else {
      // 最新录入在前：先按分区完成时间降序，同时刻再按文件名
      a.sort(function (x, y) {
        var fx = finOf(x), fy = finOf(y)
        if (fx !== fy) return fy - fx
        return x.id < y.id ? -1 : x.id > y.id ? 1 : 0
      })
    }
    return a
  }

  // ---------- 筛选 ----------

  function filterList() {
    var q = S.q.trim().toLowerCase()
    var out = []
    for (var i = 0; i < S.all.length; i++) {
      var it = S.all[i]
      if (S.v && it.v !== S.v) continue
      if (S.c && it.c !== S.c) continue
      if (S.part && it.p !== S.part) continue
      if (S.onlyNew && !isNew(it)) continue
      if (q) {
        var hay = (it.d + ' ' + it.t.join(' ') + ' ' + it.m + ' ' + it.f).toLowerCase()
        if (hay.indexOf(q) < 0) continue
      }
      out.push(it)
    }
    return out
  }

  // ---------- 卡片 ----------

  function buildCard(it) {
    var el = document.createElement('div')
    el.className = 'card'
    if (it.v === 'drop') el.classList.add('drop')
    else if (it.v === 'unsure') el.classList.add('unsure')
    if (isNew(it)) el.classList.add('new')
    el.dataset.id = it.id
    el.title = it.p + ' / ' + it.f + (it.d ? '\n' + it.d : '')

    var img = document.createElement('img')
    img.loading = 'lazy'
    img.decoding = 'async'
    img.alt = it.d || it.f
    img.src = '/img/' + encodeURIComponent(it.p) + '/' + encodeURIComponent(it.f)
    img.onerror = function () { el.classList.add('broken') }
    el.appendChild(img)

    if (it.c) {
      var pc = document.createElement('span')
      pc.className = 'pcat pc-' + it.c
      pc.textContent = it.c
      el.appendChild(pc)
    }

    var vb = document.createElement('span')
    vb.className = 'vb vb-' + (it.v || 'none')
    vb.textContent = it.v === 'keep' ? '✓' : it.v === 'unsure' ? '?' : it.v === 'drop' ? '✕' : '–'
    el.appendChild(vb)

    var dot = document.createElement('i')
    dot.className = 'dot'
    el.appendChild(dot)

    el.addEventListener('click', function () { select(it.id) })
    return el
  }

  // 全量重绘（筛选/排序变了才走这里）
  function renderGrid() {
    S.view = sortList(filterList())
    var frag = document.createDocumentFragment()
    S.elCache.clear()
    for (var i = 0; i < S.view.length; i++) {
      var el = buildCard(S.view[i])
      S.elCache.set(S.view[i].id, el)
      frag.appendChild(el)
    }
    grid.textContent = ''
    grid.appendChild(frag)
    if (S.sel) markSel(S.sel)
    updateStat()
  }

  // 增量：拿「上一轮的数据」当基准，找出这一轮才出现的
  function applyDelta(newItems, oldItems) {
    var oldIds = new Set()
    for (var i = 0; i < oldItems.length; i++) oldIds.add(oldItems[i].id)

    var fresh = []
    for (var j = 0; j < newItems.length; j++) {
      if (!oldIds.has(newItems[j].id)) fresh.push(newItems[j])
    }
    return fresh
  }

  var pendingFlash = null

  function insertFresh(fresh) {
    if (!fresh.length) return
    // 新条目按当前筛选条件过一遍
    var accept = fresh.filter(function (it) {
      if (S.v && it.v !== S.v) return false
      if (S.c && it.c !== S.c) return false
      if (S.part && it.p !== S.part) return false
      if (S.onlyNew && !isNew(it)) return false
      return true
    })
    if (!accept.length) return

    if (S.sort === 'part') {
      // 分区顺序模式下不做插入，直接重绘更稳
      renderGrid()
      return
    }

    accept = sortList(accept)
    var anchor = grid.firstChild
    for (var i = accept.length - 1; i >= 0; i--) {
      var it = accept[i]
      if (S.elCache.has(it.id)) continue
      var el = buildCard(it)
      el.classList.add('flash')
      S.elCache.set(it.id, el)
      grid.insertBefore(el, anchor)
      anchor = el
    }
    S.view = sortList(S.view.concat(accept))
  }

  // ---------- 统计 ----------

  function updateStat() {
    var tot = S.all.length
    var keep = 0, drop = 0, unsure = 0, nw = 0
    for (var i = 0; i < S.all.length; i++) {
      var it = S.all[i]
      if (it.v === 'keep') keep++
      else if (it.v === 'drop') drop++
      else if (it.v === 'unsure') unsure++
      if (isNew(it)) nw++
    }
    var rate = tot ? Math.round(keep / tot * 100) : 0
    $('stat').innerHTML =
      S.parts.length + ' 分区 · <i>' + tot + '</i> 张 · keep <i>' + keep + '</i> (' + rate + '%)' +
      ' · drop <i>' + drop + '</i> · unsure <i>' + unsure + '</i>' +
      (S.view.length !== tot ? ' · 显示 <i>' + S.view.length + '</i>' : '')

    var btn = $('btnRead')
    if (nw > 0) {
      btn.textContent = '已读 · ' + nw + ' 新'
      btn.classList.add('hot')
    } else {
      btn.textContent = '标为已读'
      btn.classList.remove('hot')
    }
  }

  // ---------- 详情 ----------

  var P_KEYS = ['P1', 'P2', 'P3', 'P4', 'P5']

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    })
  }

  var VNAME = { keep: 'keep', unsure: 'unsure', drop: 'drop' }

  function renderDetail(it) {
    var h = ''
    h += '<div class="d-imgwrap"><img src="/img/' + encodeURIComponent(it.p) + '/' +
      encodeURIComponent(it.f) + '" alt=""></div>'

    h += '<div class="d-meta">'
    h += '<span class="vbadge v-' + (it.v || 'none') + '">' + (VNAME[it.v] || '未标') + '</span>'
    if (it.c) h += '<span class="chip" style="padding:1px 6px">' + esc(it.c) + '</span>'
    if (it.cf != null) h += '<span>置信 ' + it.cf.toFixed(2) + '</span>'
    h += '</div>'

    if (it.d) h += '<div class="d-desc">' + esc(it.d) + '</div>'
    else h += '<div class="d-desc blank">（这条没有描述）</div>'

    // 分类五选一
    h += '<div class="sec"><div class="sec-t">分类</div><div class="pq">'
    for (var i = 0; i < P_KEYS.length; i++) {
      var k = P_KEYS[i]
      h += '<span class="' + (it.c === k ? 'on pq-' + k : '') + '">' + k + '</span>'
    }
    h += '</div></div>'

    // personas 五维
    if (it.pp) {
      h += '<div class="sec"><div class="sec-t">人格分</div>'
      for (var j = 0; j < P_KEYS.length; j++) {
        var kk = P_KEYS[j]
        var val = typeof it.pp[kk] === 'number' ? it.pp[kk] : 0
        var w = Math.round(val * 100)
        h += '<div class="pbar' + (val >= 0.7 ? ' hi' : '') + '">' +
          '<b>' + kk + '</b>' +
          '<div class="track"><i style="width:' + w + '%"></i></div>' +
          '<em>' + val.toFixed(2) + '</em>' +
          '</div>'
      }
      h += '</div>'
    }

    // tags
    if (it.t.length) {
      h += '<div class="sec"><div class="sec-t">标签</div><div class="chips">'
      for (var m = 0; m < it.t.length; m++) h += '<span class="chip">' + esc(it.t[m]) + '</span>'
      h += '</div></div>'
    }

    // symbol / intensity / mood
    if (it.s || it.i || it.m) {
      h += '<div class="sec"><div class="sec-t">符号</div><div class="chips">'
      if (it.s) h += '<span class="chip kv">' + esc(it.s) + '</span>'
      if (it.i) h += '<span class="chip kv">强度 ' + it.i + '</span>'
      if (it.m) h += '<span class="chip kv">' + esc(it.m) + '</span>'
      h += '</div></div>'
    }

    // negatives
    if (it.ng.length) {
      h += '<div class="sec"><div class="sec-t">雷区</div><div class="chips">'
      for (var n = 0; n < it.ng.length; n++) h += '<span class="chip bad">' + esc(it.ng[n]) + '</span>'
      h += '</div></div>'
    }

    var idx = S.view.findIndex(function (x) { return x.id === it.id })
    h += '<div class="d-nav">' +
      '<button id="btnPrev"' + (idx <= 0 ? ' disabled' : '') + '>← 上一张</button>' +
      '<button id="btnNext"' + (idx < 0 || idx >= S.view.length - 1 ? ' disabled' : '') + '>下一张 →</button>' +
      '</div>'

    h += '<div class="d-foot">' + esc(it.p) + ' · ' + esc(it.f) +
      (it.fin ? '<br>完成于 ' + esc(it.fin) : '') + '</div>'

    aside.innerHTML = h

    var b1 = $('btnPrev'), b2 = $('btnNext')
    if (b1) b1.onclick = function () { step(-1) }
    if (b2) b2.onclick = function () { step(1) }
  }

  function select(id) {
    S.sel = id
    var it = null
    for (var i = 0; i < S.all.length; i++) if (S.all[i].id === id) { it = S.all[i]; break }
    if (!it) return
    renderDetail(it)
    markSel(id)
    var el = S.elCache.get(id)
    if (el) el.scrollIntoView({ block: 'nearest' })
  }

  function markSel(id) {
    var prev = grid.querySelector('.card.sel')
    if (prev) prev.classList.remove('sel')
    var el = S.elCache.get(id)
    if (el) el.classList.add('sel')
  }

  function step(dir) {
    if (!S.sel) return
    var idx = S.view.findIndex(function (x) { return x.id === S.sel })
    var next = idx + dir
    if (next < 0 || next >= S.view.length) return
    select(S.view[next].id)
  }

  // ---------- 拉数据 ----------

  function pull(first) {
    return fetch('/api/items', { cache: 'no-store' })
      .then(function (r) { return r.json() })
      .then(function (d) {
        var prevAll = S.all
        var prevPartsLen = S.parts.length
        S.parts = d.parts || []
        S.all = d.items || []

        if (first) {
          renderGrid()
          fillParts()
        } else {
          var fresh = applyDelta(S.all, prevAll)
          if (fresh.length) {
            insertFresh(fresh)
            updateStat()
          } else {
            updateStat()
          }
          // 有新分区完成时，下拉列表跟着长出来
          if (S.parts.length !== prevPartsLen) fillParts()
        }

        // 选中的那条如果数据变了，刷新详情
        if (S.sel) {
          var cur = null
          for (var i = 0; i < S.all.length; i++) if (S.all[i].id === S.sel) { cur = S.all[i]; break }
          if (cur) {
            var old = null
            for (var j = 0; j < prevAll.length; j++) if (prevAll[j].id === S.sel) { old = prevAll[j]; break }
            if (!old || JSON.stringify(old) !== JSON.stringify(cur)) renderDetail(cur)
          }
        }
      })
      .catch(function (e) {
        $('stat').textContent = '连接断开，重试中…'
      })
  }

  function fillParts() {
    var sel = $('selPart')
    var cur = sel.value
    var h = '<option value="">全部分区</option>'
    for (var i = 0; i < S.parts.length; i++) {
      var p = S.parts[i]
      h += '<option value="' + esc(p.p) + '">' + esc(p.p) +
        '  (' + p.keep + '/' + p.n + ')</option>'
    }
    sel.innerHTML = h
    if (cur) sel.value = cur
  }

  // ---------- 事件 ----------

  $('segV').addEventListener('click', function (e) {
    var b = e.target.closest('button')
    if (!b) return
    this.querySelectorAll('button').forEach(function (x) { x.classList.remove('on') })
    b.classList.add('on')
    S.v = b.dataset.v
    renderGrid()
  })

  $('segC').addEventListener('click', function (e) {
    var b = e.target.closest('button')
    if (!b) return
    this.querySelectorAll('button').forEach(function (x) { x.classList.remove('on') })
    b.classList.add('on')
    S.c = b.dataset.c
    renderGrid()
  })

  $('selPart').addEventListener('change', function () { S.part = this.value; renderGrid() })
  $('selSort').addEventListener('change', function () { S.sort = this.value; renderGrid() })

  var qt = null
  $('q').addEventListener('input', function () {
    var val = this.value
    clearTimeout(qt)
    qt = setTimeout(function () { S.q = val; renderGrid() }, 180)
  })

  $('btnOnlyNew').addEventListener('click', function () {
    S.onlyNew = !S.onlyNew
    this.classList.toggle('on', S.onlyNew)
    renderGrid()
  })

  $('btnRead').addEventListener('click', function () {
    // 用当前最大 finished_at 作为已读线，避免 AI 写了未来时间导致红点清不掉
    var maxFin = 0
    for (var i = 0; i < S.all.length; i++) {
      var t = finOf(S.all[i])
      if (t > maxFin) maxFin = t
    }
    S.readAt = Math.max(Date.now(), maxFin)
    localStorage.setItem(LS_READ, String(S.readAt))
    var els = grid.querySelectorAll('.card.new')
    for (var j = 0; j < els.length; j++) els[j].classList.remove('new')
    if (S.onlyNew) renderGrid()
    updateStat()
  })

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return
    if (e.key === 'ArrowLeft') { step(-1); e.preventDefault() }
    else if (e.key === 'ArrowRight') { step(1); e.preventDefault() }
  })

  // ---------- 启动 ----------

  S.readAt = loadReadAt()
  pull(true)
  setInterval(function () { pull(false) }, POLL_MS)
})()
</script>
</body>
</html>
